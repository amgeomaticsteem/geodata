<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEOData | AM Geomatics</title>
<meta name="description" content="GEOData: free shapefiles, geodatabases, GIS courses, programs and data sources in one place.">
<link rel="icon" href="assets/logo-for-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=geodata-esri-v1-20261111-3">
</head>
<body class="lang-ar" data-theme="light">
<div class="bg" aria-hidden="true"></div>

<div class="nav-clock-shell">
<header id="mainNav" class="nav">
  <a class="brand" href="#home" aria-label="GEOData">
    <img class="logo-l" src="assets/logo-for-light.png" alt="GEOData">
  </a>
  <nav id="links">
    <a href="#home" data-i="home"></a>
    <a href="#data" data-i="data"></a>
    <a href="#courses" data-i="courses"></a>
    <a href="#programs" data-i="programs"></a>
    <a href="#sites" data-i="sites"></a>
    <a href="#about" data-i="about"></a>
    <a href="#admin" id="adminLink" hidden><span data-i="admin"></span><em id="pc"></em></a>
  </nav>
  <div class="actions">
    <button class="ibtn" id="lang" aria-label="Language">EN</button>
    <button class="ibtn" id="bell" hidden aria-label="Notifications"><img class="ico" src="assets/icon-bell.png" alt=""><i id="dot" hidden></i></button>
    <button class="btn ghost" id="login"><img class="ico" src="assets/icon-user.png" alt=""><span data-i="login"></span></button>
    <div id="user" hidden><img class="ico" src="assets/icon-user.png" alt=""><b id="uname"></b><button class="link" id="logout" data-i="logout"></button></div>
    <button class="ibtn burger" id="burger" aria-label="Menu">☰</button>
  </div>
</header>
</div>

<main>
  <section id="home" class="page">
    <div class="hero-esri">
      <div class="hero-space" aria-hidden="true">
        <div class="space-stars"></div>
        <canvas id="earth" aria-label="Rotating Earth globe"></canvas>
        <div class="globe-caption">GEOdata · Explore the world</div>
      </div>
      <div class="hero-copy">
        <span class="eyebrow" data-i="heroEyebrow">OPEN GEOSPATIAL LIBRARY</span>
        <h1 id="heroTitle" data-i="h1"></h1>
        <p class="lead" data-i="lead"></p>
        <div class="hero-actions">
          <a class="btn hero-primary" href="#data" data-i="explore"></a>
          <a class="btn hero-secondary" href="#about" data-i="aboutAction"></a>
        </div>
        <form id="heroSearch" class="hsearch">
          <input type="search" name="q" data-ph="heroPh" autocomplete="off" aria-label="Search GEOData">
          <button class="btn" data-i="search"></button>
        </form>
        <div id="heroSuggestions" class="search-suggestions hero-suggestions" hidden></div>
        <div class="hero-stats">
          <span><b>01</b><small data-i="statData"></small></span>
          <span><b>02</b><small data-i="statLearning"></small></span>
          <span><b>03</b><small data-i="statTools"></small></span>
        </div>
      </div>
    </div>
    <div class="home-feature-strip">
      <span data-i="featureLine"></span><a href="#data" data-i="browseData"></a>
    </div>
  </section>

  <section id="data" class="page coll"></section>
  <section id="courses" class="page coll"></section>
  <section id="programs" class="page coll"></section>
  <section id="sites" class="page coll"></section>
  <section id="resource" class="page">
    <div class="resource-page-shell">
      <aside class="detail-category-sidebar" id="detailCategorySidebar"></aside>
      <article class="resource-detail-content" id="resourceDetailContent"></article>
      <aside class="course-playlist-sidebar" id="coursePlaylistSidebar" hidden></aside>
    </div>
  </section>

  <section id="search" class="page">
    <div class="phead">
      <h2 data-i="searchTitle"></h2>
      <p data-i="searchHint"></p>
      <small id="searchSummary"></small>
    </div>
    <div class="grid" id="globalResults"></div>
  </section>

  <section id="about" class="page">
    <div class="about-esri">
      <span class="eyebrow">GEOData / ABOUT</span>
      <h2 data-i="about"></h2>
      <p data-i="aboutP"></p>
      <a class="btn hero-primary" href="#data" data-i="explore"></a>
    </div>
  </section>
  <section id="admin" class="page">
    <div class="phead"><h2 data-i="admin"></h2><p data-i="adminD"></p></div>
    <h3 class="admin-subhead" data-i="submissionsHeading">طلبات النشر</h3>
    <div class="grid" id="adminList"></div>
    <h3 class="admin-subhead" data-i="reportsHeading">بلاغات المحتوى</h3>
    <div class="grid" id="reportsList"></div>
  </section>
</main>

<footer data-i="footer"></footer>

<dialog id="authM">
  <button class="x" type="button" aria-label="Close" onclick="this.closest('dialog').close()">✕</button>
  <form id="authF" data-mode="login">
    <div class="tabs">
      <button type="button" class="on" data-mode="login" data-i="login"></button>
      <button type="button" data-mode="reg" data-i="register"></button>
    </div>
    <input class="only-reg" name="name" data-ph="name" autocomplete="name">
    <input type="email" name="email" data-ph="email" required autocomplete="email">
    <input type="password" name="pass" data-ph="pass" required minlength="6" autocomplete="current-password">
    <p id="authError" class="auth-error" role="alert" hidden></p>
    <button class="btn" type="submit" data-i="go"></button>
  </form>
</dialog>

<dialog id="addM">
  <button class="x" type="button" aria-label="Close" onclick="this.closest('dialog').close()">✕</button>
  <form id="addF">
    <h3 id="addT"></h3>
    <input name="title" data-ph="title" required>
    <div class="only-data form-field">
      <label for="dataCategory" data-i="categoryLabel"></label>
      <select name="dataCategory" id="dataCategory"></select>
    </div>
    <div class="only-data row">
      <select name="format"><option data-i="shapefile">Shapefile</option><option data-i="geodatabase">Geodatabase</option><option data-i="geotiff">GeoTIFF</option><option data-i="geojson">GeoJSON / KML</option></select>
      <input type="date" name="date">
    </div>
    <div class="only-courses form-field">
      <label for="courseCategory" data-i="categoryLabel"></label>
      <select name="courseCategory" id="courseCategory"></select>
    </div>
    <div class="only-courses form-field">
      <label for="courseLanguage" data-i="courseLanguage"></label>
      <select name="courseLanguage" id="courseLanguage"></select>
    </div>
    <textarea name="details" rows="4" data-ph="details"></textarea>
    <input type="url" name="link" data-ph="link" required>
    <button class="btn" data-i="publish"></button>
  </form>
</dialog>

<dialog id="reportM" class="report-dialog">
  <button class="x" type="button" aria-label="Close" onclick="this.closest('dialog').close()">✕</button>
  <form id="reportForm">
    <h3 data-i="reportTitle">الإبلاغ عن محتوى</h3>
    <p id="reportResourceTitle" class="report-resource-title"></p>
    <label for="reportReason" data-i="reportReasonLabel">سبب البلاغ</label>
    <textarea id="reportReason" name="reason" maxlength="1200" rows="5" required data-ph="reportReasonPh"></textarea>
    <button class="btn" type="submit" data-i="sendReport">إرسال البلاغ</button>
    <small data-i="reportPrivacy">سيظهر البلاغ في مركز التحكم لمراجعته.</small>
  </form>
</dialog>

<dialog id="notifM"><button class="x" type="button" aria-label="Close" onclick="this.closest('dialog').close()">✕</button><h3 data-i="notifs"></h3><div id="notifL"></div></dialog>

<dialog id="detailsM" class="details-dialog" aria-labelledby="detailTitle">
  <button class="x" type="button" aria-label="Close" onclick="this.closest('dialog').close()">✕</button>
  <div class="detail-heading">
    <span id="detailCategory" class="tag"></span>
    <h2 id="detailTitle"></h2>
    <span id="detailFormat" class="detail-format"></span>
  </div>
  <div class="detail-description">
    <h3 data-i="details"></h3>
    <p id="detailDescription"></p>
  </div>
  <div class="detail-meta">
    <div><small data-i="publisher"></small><b id="detailPublisher"></b></div>
    <div><small data-i="date"></small><b id="detailDate"></b></div>
    <div><small data-i="categoryLabel"></small><b id="detailSubjectCategory"></b></div>
    <div><small data-i="courseLanguage"></small><b id="detailCourseLanguage"></b></div>
    <div><small data-i="theme"></small><b id="detailTheme"></b></div>
    <div><small data-i="coverage"></small><b id="detailCoverage"></b></div>
    <div><small data-i="source"></small><b id="detailSource"></b></div>
    <div><small data-i="license"></small><b id="detailLicense"></b></div>
  </div>
  <p id="detailMachine" class="machine-note"></p>
  <div class="detail-actions">
    <a id="detailVisit" class="btn" href="#" target="_blank" rel="noopener noreferrer" data-i="visit"></a>
    <button class="btn ghost" type="button" onclick="this.closest('dialog').close()" data-i="close"></button>
  </div>
</dialog>


<div class="geo-ai-widget" id="geoAiWidget">
  <section class="geo-ai-panel" id="geoAiPanel" hidden aria-label="GEOData assistant">
    <header class="geo-ai-header">
      <div class="geo-ai-brand">
        <img id="geoAiHeaderIcon" src="assets/bot dark.png" alt="">
        <div><strong id="geoAiTitle">مساعد GEOData</strong><small id="geoAiSubtitle">متخصص في GIS والجيوماتكس</small></div>
      </div>
      <button type="button" class="geo-ai-close" id="geoAiClose" aria-label="إغلاق">×</button>
    </header>
    <div class="geo-ai-messages" id="geoAiMessages" aria-live="polite">
      <div class="geo-ai-message assistant" data-welcome="true">أهلًا بيك في GEOData 👋 أقدر أساعدك إزاي؟</div>
    </div>
    <form class="geo-ai-form" id="geoAiForm">
      <input id="geoAiInput" type="text" maxlength="1200" autocomplete="off" placeholder="اسأل عن GIS أو البيانات الجغرافية..." required>
      <button id="geoAiSend" type="submit" aria-label="إرسال">➤</button>
    </form>
    <div class="geo-ai-footnote" id="geoAiFootnote">إجابات متخصصة في نظم المعلومات الجغرافية فقط</div>
  </section>
  <button class="geo-ai-launcher" id="geoAiLauncher" type="button" aria-label="افتح مساعد GEOData" aria-expanded="false">
    <img id="geoAiIcon" src="assets/bot dark.png" alt="">
  </button>
</div>

<div id="toast" role="status"></div>
<script type="module" src="globe.js?v=geodata-esri-v1-20261111-3"></script>
<script type="module" src="app.js?v=geodata-esri-v1-20261111-3"></script>
</body>
</html>
