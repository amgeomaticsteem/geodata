name: GEOData automatic curator

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'agent/**'
      - '.github/workflows/geodata-agent.yml'
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to Firestore (recommended for first test)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: geodata-curator
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: am-a-geo
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Validate frontend JavaScript
        run: node --input-type=module --check < app.js

      - name: Validate Python agent
        run: python -m compileall -q agent

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Select execution mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          elif [[ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
            echo "No Firebase secret configured yet: running safely in dry-run mode."
          else
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Run GEOData curator
        run: python -m agent.main
