name: GEOData automatic curator

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without writing to Firestore (recommended for first test)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: geodata-curator
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Select execution mode
        shell: bash
        run: |
          if [[ "\${{ github.event_name }}" == "workflow_dispatch" && "\${{ inputs.dry_run }}" == "true" ]]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          else
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Run GEOData curator
        env:
          FIREBASE_PROJECT_ID: am-a-geo
          FIREBASE_SERVICE_ACCOUNT_JSON: \${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: \${{ github.token }}
        run: python -m agent.main
